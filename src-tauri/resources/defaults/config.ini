# MoLaunch 配置文件
# 此文件由程序自动生成，可手动编辑

[General]
# Minecraft 游戏目录（相对于 .molaunch 或绝对路径）
game_dir=.minecraft
# 主题：system / dark / light
theme=system
# 语言
language=zh-CN

[Download]
# 最大下载线程数
max_threads=8
# 最大下载速度（字节/秒，0=不限制）
max_speed=0
# 下载源模式：official / mirror / smart
source=smart
# 镜像模式：0=手动, 1=自动探测降级
mirror_mode=0

[Mirror]
# 镜像源 URL（留空使用官方源）
url=https://bmclapi2.bangbang93.com
# 版本清单镜像（留空回退到 url）
url_meta=
# 资源下载镜像（留空回退到 url）
url_download=

[Memory]
# 最小内存（MB）
min=512
# 最大内存（MB）
max=2048

[Log]
# 日志级别：0=off, 1=error, 2=warn, 3=info, 4=debug, 5=trace
level=3
