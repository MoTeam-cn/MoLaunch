# MoLaunch 配置文件
# 此文件由程序自动生成，可手动编辑

[General]
# Minecraft 游戏目录（相对于 .molaunch 或绝对路径）
game_dir=.minecraft
# 主题：system / dark / light
theme=system
# 语言
language=zh-CN
# 版本隔离模式：0=关闭, 1=隔离Mod版本, 2=隔离非正式版, 3=隔离非正式+Mod, 4=隔离所有
isolation_mode=4

[Folders]
# Minecraft 文件夹列表（JSON 数组，每项含 name 和 path）
# 示例：[{"name":"默认","path":".minecraft"},{"name":"整合包","path":"D:\\Game\\Modpack"}]
list=[{"name":"默认","path":".minecraft"}]

[Java]
# Java 路径（留空则自动选择最佳 Java）
path=

[Download]
# 最大下载线程数
max_threads=8
# 最大下载速度（字节/秒，0=不限制）
max_speed=0
# 下载源模式：official / mirror / smart
source=smart
# 镜像模式：0=手动, 1=自动探测降级
mirror_mode=0
# 分片下载数量
chunk_count=4

[Mirror]
# 镜像源 URL（留空使用官方源）
url=https://bmclapi2.bangbang93.com
# 版本清单镜像（留空回退到 url）
url_meta=
# 资源下载镜像（留空回退到 url）
url_download=

[Memory]
# 内存模式：auto / custom
mode=auto
# 最小内存（MB），0=自动
min=0
# 最大内存（MB），0=自动
max=0

[Log]
# 日志级别：0=off, 1=error, 2=warn, 3=info, 4=debug, 5=trace
level=3

[Proxy]
# 代理模式：none / system / custom
mode=none
# 代理类型：http / https / socks5
type=http
# 自定义代理地址
url=

[CurseForge]
# 是否启用 CurseForge API Key（启用后使用官方 API，不走镜像）
enabled=false
# CurseForge API Key（SDK DES 加密后存储，非明文；从 https://console.curseforge.com/ 申请）
api_key=
