# MoLaunch 配置文件
# 此文件由程序自动生成，可手动编辑

[General]
# Minecraft 游戏目录（相对于 .molaunch 或绝对路径）
game_dir=.minecraft
# 主题：system / dark / light
theme=system
# 语言
language=zh-CN
# 版本隔离模式：0=关闭, 1=隔离Mod版本, 2=隔离非正式版, 3=隔离非正式+Mod, 4=隔离所有
isolation_mode=4
# 主题主色 HEX（如 #165dff），驱动 primary-* 色阶
primary_color=
# 关闭主窗口时的行为：ask=每次询问 / tray=保留托盘 / exit=直接退出
close_behavior=ask
# 启动器界面 GPU 硬件加速（true=开启 / false=关闭，关闭后 WebView2 走软件渲染降低内存占用，需重启生效）
use_gpu_acceleration=true
# 关闭到托盘时挂起 WebView2 释放渲染资源（true=开启 / false=关闭；恢复托盘窗口时自动恢复并保留界面状态）
release_memory_on_tray=false

[Folders]
# Minecraft 文件夹列表（JSON 数组，每项含 name 和 path）
# 示例：[{"name":"默认","path":".minecraft"},{"name":"整合包","path":"D:\\Game\\Modpack"}]
list=[{"name":"默认","path":".minecraft"}]

[Java]
# Java 路径（留空则自动选择最佳 Java）
path=

[Download]
# 最大下载线程数
max_threads=8
# 最大下载速度（字节/秒，0=不限制）
max_speed=0
# 文件下载源模式：official / mirror / smart
source=smart
# 版本列表源模式：official / mirror / smart
meta_source=smart
# 镜像模式：0=手动, 1=自动探测降级
mirror_mode=0
# 分片下载数量
chunk_count=4
# Modrinth CDN 直连开关（将 cdn.modrinth.com 替换为 cdn-raw.modrinth.com，绕过中国大陆 cdn-alt 跳转）
modrinth_cdn_raw_enabled=false

[Mirror]
# 镜像源 URL（留空使用官方源）
url=https://bmclapi2.bangbang93.com
# 版本清单镜像（留空回退到 url）
url_meta=
# 资源下载镜像（留空回退到 url）
url_download=

[Memory]
# 内存模式：auto / custom
mode=auto
# 最小内存（MB），0=自动
min=0
# 最大内存（MB），0=自动
max=0

[Log]
# 日志级别：0=off, 1=error, 2=warn, 3=info, 4=debug, 5=trace
level=3

[Proxy]
# 代理模式：none / system / custom
mode=none
# 代理类型：http / https / socks5
type=http
# 自定义代理地址
url=
# IP 协议版本偏好：v4（强制 IPv4）/ auto（自动测试）/ any（跟随 DNS）
ip_version=any

[Community]
# 社区资源来源策略：0=尽量镜像 / 1=缓慢时换镜像 / 2=尽量官方
source=2
# 下载文件名格式：0=【译名】原名 / 1=[译名] 原名 / 2=译名-原名 / 3=原名-译名 / 4=仅原名
filename_format=1
# Mod 管理页显示样式：0=标题译名/详情文件名 / 1=标题文件名/详情译名
mod_local_name_style=0
# 在显示 Mod 加载器时忽略 Quilt
ignore_quilt=true

[CurseForge]
# 是否启用 CurseForge API Key（启用后使用官方 API，不走镜像）
enabled=false
# CurseForge API Key（SDK DES 加密后存储，非明文；从 https://console.curseforge.com/ 申请）
api_key=

[AI]
# OpenAI 兼容 API 服务地址（如 http://127.0.0.1:11434/v1；本地 Ollama / LM Studio）
base_url=
# API Key（SDK DES 加密后存储，非明文；本地服务如 Ollama 无需填写）
api_key=
# 请求超时秒数
timeout_secs=60
# 已启用（导入）的模型列表（JSON 数组，设置页从服务端加载后勾选）
models=[]
# 默认模型名
default_model=
# 上下文窗口 token 上限（输入侧，超限自动压缩上下文）
max_input_tokens=184000
# 单次回复最大输出 token
max_output_tokens=16000

[Launch]
# 禁用 Java Launch Wrapper（修复 Java 18- 中文路径启动问题，默认 false）
disable_jlw=false
# 禁用 LWJGL Unsafe Agent（修复 LWJGL 3.4.1 性能问题，默认 false）
disable_lua=false
# 使用高性能显卡（自动在 Windows 设置中将 Java 改为使用独显，默认 false）
use_dedicated_gpu=false

[Online]
# 联机 api-server 地址（默认生产地址，可改为本地开发地址 http://127.0.0.1:3000）
api_server_url=https://api.molaunch.moiu.cn
# GitHub 镜像源（JSON 数组，easytier 等外部下载竞速选源用；留空时前端启动自动测速注入默认源）
github_proxies=[]

[TLS]
# TLS 信任源模式：builtin / system / custom / system+custom / builtin+custom / all
# - builtin：仅 webpki-roots（reqwest 内置根证书）
# - system：仅操作系统根证书（rustls-native-certs 加载）
# - custom：仅 certs 目录下用户自定义 PEM（.Molaunch/certs/*.pem）
# - system+custom / builtin+custom：组合模式
# - all：三种来源全部加载
# IgnoreTls 走注册表（开发者模式键），不在此处持久化
trust_mode=builtin
