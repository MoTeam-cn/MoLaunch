# MoLaunch 版本独立设置文件
# 此文件由程序自动生成，可手动编辑
# 每个版本目录下都有一个 setup.ini，记录该版本的个性化设置

[info]
# 原始 MC 版本号（如 1.20.1）
OriginalVersion=
# 版本类型：release / snapshot / forge / neoforge / fabric / quilt / optifine / liteloader / old
Type=release
# 自定义图标文件名（空=自动判断）
Logo=
# 自定义描述（空=使用默认描述）
CustomInfo=
# 强制版本分类：0=自动, 1=隐藏, 2=可安装Mod, 3=原版类似, 4=垃圾, 5=愚人节, 6=错误
DisplayType=0
# 是否收藏
IsStar=false
# 版本独立隔离设置：0=跟随全局, 1=开启隔离, 2=关闭隔离
IndieType=0
# 游戏窗口标题（空=跟随全局）
WindowTitle=
# 自动进入服务器（"IP:Port" 格式，空=不自动进入）
ServerEnter=
# 额外 JVM 参数（空=跟随全局）
AdvanceJvmArgs=
# 额外游戏参数（空=跟随全局）
AdvanceGameArgs=
# 启动前执行命令（空=跟随全局）
AdvanceRunCmd=
# 版本独立 Java 路径（空=自动选择）
JavaPath=

[Memory]
# 内存模式：空=跟随全局, auto=自动配置, custom=自定义
MemoryMode=
# 最小内存（MB），仅 custom 模式生效
MinMemory=0
# 最大内存（MB），仅 custom 模式生效
MaxMemory=0
