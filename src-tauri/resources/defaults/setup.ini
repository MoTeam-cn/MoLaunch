# MoLaunch 版本独立设置文件
# 此文件由程序自动生成，可手动编辑
# 每个版本目录下都有一个 setup.ini，记录该版本的个性化设置

[info]
# 原始 MC 版本号（如 1.20.1）
OriginalVersion=
# 版本类型：release / snapshot / forge / neoforge / fabric / quilt / optifine / liteloader / old
Type=release
# 自定义图标文件名（空=自动判断）
Logo=
# 自定义描述（空=使用默认描述）
CustomInfo=
# 强制版本分类：0=自动, 1=隐藏, 2=可安装Mod, 3=原版类似, 4=垃圾, 5=愚人节, 6=错误
DisplayType=0
# 是否收藏
IsStar=false
# 版本独立隔离设置：0=跟随全局, 1=开启隔离, 2=关闭隔离
IndieType=0
# 游戏窗口标题（空=跟随全局）
WindowTitle=
# 自动进入服务器（"IP:Port" 格式，空=不自动进入）
ServerEnter=
# 额外 JVM 参数（空=跟随全局）
AdvanceJvmArgs=
# 额外游戏参数（空=跟随全局）
AdvanceGameArgs=
# 启动前执行命令（空=跟随全局）
AdvanceRunCmd=
# 禁止更新 Mod（false=允许更新，true=禁止更新，防止整合包玩家误操作）
AdvanceDisableModUpdate=false
# 忽略 Java 兼容性警告（false=正常警告，true=跳过警告强制使用手动选择的 Java）
AdvanceIgnoreJavaWarning=false
# 关闭文件校验（false=正常校验，true=不校验 libraries/assets/主 jar 文件是否被修改）
AdvanceDisableAssetsVerify=false
# 禁用 Java Launch Wrapper（false=启用 JLW 修复中文路径问题，true=禁用）
AdvanceDisableJLW=false
# 禁用 LWJGL Unsafe Agent（false=启用 LUA 修复 LWJGL 3.4.1 性能问题，true=禁用）
AdvanceDisableLUA=false
# 版本独立 Java 路径（仅 JavaMode=custom 时生效，空=自动选择）
JavaPath=
# Java 选择模式：空/auto=自动选择, auto_version=自动选择指定版本范围, folder=使用版本文件夹中的 Java, custom=使用指定的 Java
JavaMode=
# 自动选择时的最小 Java 主版本（仅 auto_version 模式生效，0=不限）
JavaVersionMin=0
# 自动选择时的最大 Java 主版本（仅 auto_version 模式生效，0=不限）
JavaVersionMax=0

[Memory]
# 内存模式：空=跟随全局, auto=自动配置, custom=自定义
MemoryMode=
# 最小内存（MB），仅 custom 模式生效
MinMemory=0
# 最大内存（MB），仅 custom 模式生效
MaxMemory=0
