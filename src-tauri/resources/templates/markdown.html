<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e; color: #cdd6f4;
      height: 100vh; display: flex; flex-direction: column;
      user-select: none;
    }
    .titlebar {
      display: flex; align-items: center; padding: 12px 24px;
      background: #181825; border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }
    .title {
      font-size: 15px; font-weight: 600; color: #cdd6f4;
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .content {
      flex: 1; overflow-y: auto; padding: 24px 32px;
      font-size: 14px; line-height: 1.7; color: #cdd6f4;
      user-select: text;
    }
    /* Markdown 渲染样式 */
    .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 {
      margin: 20px 0 12px; font-weight: 600; line-height: 1.3;
    }
    .content h1 { font-size: 24px; padding-bottom: 8px; border-bottom: 1px solid #313244; }
    .content h2 { font-size: 20px; }
    .content h3 { font-size: 17px; }
    .content h4 { font-size: 15px; }
    .content p { margin: 8px 0; }
    .content ul, .content ol { margin: 8px 0; padding-left: 24px; }
    .content li { margin: 4px 0; }
    .content code {
      background: #313244; padding: 2px 6px; border-radius: 3px;
      font-family: 'Cascadia Code', 'Consolas', monospace; font-size: 13px;
      color: #f38ba8;
    }
    .content pre {
      background: #11111b; padding: 12px 16px; border-radius: 6px;
      overflow-x: auto; margin: 12px 0; border: 1px solid #313244;
    }
    .content pre code {
      background: transparent; padding: 0; color: #cdd6f4;
      font-size: 13px; line-height: 1.5;
    }
    .content blockquote {
      border-left: 3px solid #89b4fa; padding-left: 16px;
      margin: 12px 0; color: #a6adc8;
    }
    .content a {
      color: #89b4fa; text-decoration: none;
    }
    .content a:hover { text-decoration: underline; }
    .content table {
      border-collapse: collapse; margin: 12px 0; width: 100%;
    }
    .content th, .content td {
      border: 1px solid #313244; padding: 8px 12px; text-align: left;
    }
    .content th { background: #313244; font-weight: 600; }
    .content img { max-width: 100%; border-radius: 4px; }
    .content hr {
      border: none; border-top: 1px solid #313244; margin: 20px 0;
    }
    .loading {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #6c7086; font-size: 14px; gap: 8px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #45475a; border-top-color: #89b4fa;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #45475a; border-radius: 4px; }
  </style>
</head>
<body oncontextmenu="return false">
  <div class="titlebar">
    <div class="title" id="title">文档</div>
  </div>
  <div class="content" id="content">
    <div class="loading">
      <div class="spinner"></div>
      <span>加载中...</span>
    </div>
  </div>
  <script>
    // 禁用 DevTools 快捷键
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
    });

    var DATA = window.__PICKER_DATA__ || {};
    var titleEl = document.getElementById('title');
    var contentEl = document.getElementById('content');

    if (DATA.title) {
      titleEl.textContent = DATA.title;
      document.title = DATA.title;
    }

    // marked.min.js 已由后端内联注入（避免 res:// 跨源加载问题）
    try {
      var markdownText = DATA.content || '';
      if (typeof marked !== 'undefined') {
        if (marked.setOptions) {
          marked.setOptions({ gfm: true, breaks: true });
        }
        contentEl.innerHTML = DOMPurify.sanitize(marked.parse(markdownText));
      } else {
        contentEl.textContent = markdownText;
      }
    } catch (e) {
      var errHtml = '<p style="color:#f38ba8;">渲染失败: ' + escapeHtml(e.message) + '</p><pre>' + escapeHtml(DATA.content || '') + '</pre>';
      contentEl.innerHTML = (typeof DOMPurify !== 'undefined') ? DOMPurify.sanitize(errHtml) : errHtml;
    }

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
