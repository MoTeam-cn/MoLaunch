<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正在跳转</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e2e; color: #cdd6f4;
      height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; user-select: none; padding: 24px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #45475a; border-top-color: #89b4fa;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .text { font-size: 14px; color: #cdd6f4; }
    .url {
      font-size: 12px; color: #6c7086; max-width: 320px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      user-select: text;
    }
    .error { font-size: 13px; color: #f38ba8; text-align: center; max-width: 300px; }
  </style>
</head>
<body oncontextmenu="return false">
  <div class="spinner" id="spinner"></div>
  <div class="text" id="text">正在跳转...</div>
  <div class="url" id="url"></div>
  <script>
    // 禁用 DevTools 快捷键
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
    });

    var DATA = window.__PICKER_DATA__ || {};
    var url = DATA.url || '';
    var spinnerEl = document.getElementById('spinner');
    var textEl = document.getElementById('text');
    var urlEl = document.getElementById('url');

    function showError(msg) {
      spinnerEl.style.display = 'none';
      textEl.style.display = 'none';
      urlEl.style.display = 'none';
      var errEl = document.createElement('div');
      errEl.className = 'error';
      errEl.textContent = msg;
      document.body.appendChild(errEl);
    }

    if (!url || typeof url !== 'string') {
      showError('无效的跳转地址');
    } else {
      urlEl.textContent = url;
      urlEl.title = url;
      setTimeout(function() {
        try {
          window.location.href = url;
        } catch (e) {
          showError('跳转失败');
        }
      }, 1000);
    }
  </script>
</body>
</html>
