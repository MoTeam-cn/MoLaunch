<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图片查看</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #11111b; color: #cdd6f4;
      height: 100vh; display: flex; flex-direction: column;
      user-select: none; overflow: hidden;
    }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 16px; background: #1e1e2e; border-bottom: 1px solid #313244;
      flex-shrink: 0;
    }
    .alt {
      font-size: 13px; color: #a6adc8;
      max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .controls { display: flex; gap: 4px; }
    .btn {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      background: #313244; border: 1px solid #45475a; border-radius: 4px;
      color: #cdd6f4; cursor: pointer; font-size: 16px;
      transition: background 0.15s;
    }
    .btn:hover { background: #45475a; }
    .viewport {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; cursor: grab;
    }
    .viewport.dragging { cursor: grabbing; }
    .img-wrapper {
      transition: transform 0.1s ease-out;
      will-change: transform;
    }
    .img-wrapper.no-transition { transition: none; }
    img {
      max-width: 90vw; max-height: 80vh;
      display: block; user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    .error {
      color: #f38ba8; font-size: 14px; text-align: center; padding: 40px;
    }
  </style>
</head>
<body oncontextmenu="return false">
  <div class="toolbar">
    <div class="alt" id="alt"></div>
    <div class="controls">
      <div class="btn" id="btn-zoom-out" title="缩小">−</div>
      <div class="btn" id="btn-reset" title="重置">1:1</div>
      <div class="btn" id="btn-zoom-in" title="放大">+</div>
    </div>
  </div>
  <div class="viewport" id="viewport">
    <div class="img-wrapper" id="wrapper">
      <img id="img" alt="">
    </div>
  </div>
  <script>
    // 禁用 DevTools 快捷键
    document.addEventListener('keydown', function(e) {
      if (e.key === 'F12') { e.preventDefault(); return false; }
      if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); return false; }
      if (e.ctrlKey && e.key === 'u') { e.preventDefault(); return false; }
    });

    var DATA = window.__PICKER_DATA__ || {};
    var altEl = document.getElementById('alt');
    var imgEl = document.getElementById('img');
    var wrapperEl = document.getElementById('wrapper');
    var viewportEl = document.getElementById('viewport');
    var btnZoomIn = document.getElementById('btn-zoom-in');
    var btnZoomOut = document.getElementById('btn-zoom-out');
    var btnReset = document.getElementById('btn-reset');

    var scale = 1;
    var offsetX = 0, offsetY = 0;
    var isDragging = false;
    var dragStartX = 0, dragStartY = 0;
    var startOffsetX = 0, startOffsetY = 0;

    // 设置 alt 文本
    if (DATA.alt) {
      altEl.textContent = DATA.alt;
      imgEl.alt = DATA.alt;
    }

    function applyTransform() {
      wrapperEl.style.transform = 'translate(' + offsetX + 'px, ' + offsetY + 'px) scale(' + scale + ')';
    }

    function setScale(newScale) {
      scale = Math.max(0.1, Math.min(10, newScale));
      applyTransform();
    }

    // 加载图片
    if (DATA.url) {
      imgEl.onload = function() {
        // 加载成功
      };
      imgEl.onerror = function() {
        wrapperEl.innerHTML = '<div class="error">图片加载失败</div>';
      };
      imgEl.src = DATA.url;
    } else {
      wrapperEl.innerHTML = '<div class="error">未提供图片地址</div>';
    }

    // 缩放按钮
    btnZoomIn.addEventListener('click', function() { setScale(scale * 1.2); });
    btnZoomOut.addEventListener('click', function() { setScale(scale / 1.2); });
    btnReset.addEventListener('click', function() {
      scale = 1; offsetX = 0; offsetY = 0; applyTransform();
    });

    // 滚轮缩放
    viewportEl.addEventListener('wheel', function(e) {
      e.preventDefault();
      var delta = e.deltaY < 0 ? 1.1 : 0.9;
      setScale(scale * delta);
    }, { passive: false });

    // 拖拽平移
    viewportEl.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return;
      isDragging = true;
      viewportEl.classList.add('dragging');
      wrapperEl.classList.add('no-transition');
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      startOffsetX = offsetX;
      startOffsetY = offsetY;
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      offsetX = startOffsetX + (e.clientX - dragStartX);
      offsetY = startOffsetY + (e.clientY - dragStartY);
      applyTransform();
    });

    document.addEventListener('mouseup', function() {
      if (!isDragging) return;
      isDragging = false;
      viewportEl.classList.remove('dragging');
      wrapperEl.classList.remove('no-transition');
    });
  </script>
</body>
</html>
