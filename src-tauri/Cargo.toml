[package]
name = "mo-launch"
version = "0.1.0"
description = "Modern Minecraft Launcher"
authors = ["MoTeam"]
license = "MIT"
repository = "https://github.com/MoTeam-cn/MoLaunch"
edition = "2021"

[lib]
name = "mo_launch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# cubiomes 现在通过 Emscripten (emcc) 编译为 WebAssembly（见 build.rs），
# 不再使用 cc crate 编译为静态库——前端通过 WASM 直接调用，无需 Rust FFI 中转

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["sync", "rt", "macros", "process"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
libloading = "0.8"
reqwest = { version = "0.11", features = ["json", "stream", "multipart", "gzip"] }
sysinfo = "0.29"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
futures-util = "0.3"
zip = "2"
regex = "1"
anyhow = "1"
chrono = "0.4"
urlencoding = "2.1"
once_cell = "1"
base64 = "0.22"
encoding_rs = "0.8"
# gzip 解压（NBT 文件通常为 gzip 压缩，如 player .dat / level.dat）
flate2 = "1"
# NBT 解析（替代早期手动实现；simdnbt 依赖 nightly portable_simd 不可用，改用 fastnbt）
# fastnbt 2.x：stable 兼容，serde 设计，社区验证，支持嵌套 TAG_List / 空 compound / 超大数组
fastnbt = "2"
# 文件系统监听（用于 mods 目录自动刷新，参考 PCL2 FileSystemWatcher）
notify = "8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Win32 API（用于游戏窗口标题修改，参考 PCL2 ModWatcher.vb）
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
