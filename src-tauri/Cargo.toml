[package]
name = "mo-launch"
version = "0.3.6-rc4"
description = "Modern Minecraft Launcher"
authors = ["MoTeam"]
license-file = "LICENSE"
repository = "https://github.com/MoTeam-cn/MoLaunch"
edition = "2021"

[lib]
name = "mo_launch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# cubiomes 已迁移前端编译（scripts/build-wasm.cjs → src/assets/seedmap/），
# 不再使用 cc crate 编译为静态库或经 build.rs 编译——前端通过 WASM 直接调用，无需 Rust FFI 中转

[dependencies]
# 启用 devtools feature：让 release 构建也支持 open_devtools() 调用
# （Tauri 默认仅在 debug 构建开启 devtools；测试版需要在开发者模式开启时
# 通过设置页按钮调出 devtools 用于排查问题，故 release 也需开启）
# 安全约束：open_devtools() 后端 action 内部校验 is_developer_unlocked() &&
# is_developer_mode()，普通用户无法触发
tauri = { version = "2", features = ["devtools", "tray-icon", "image-ico", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
# 深度链接（molaunch:// 协议：注册 scheme + 解析 URL + 路由到注册的 handler）
# Windows/Linux 上 deep link 以 CLI 参数启动新实例，需配合 single-instance 插件的
# "deep-link" feature 才能把 URL 转发给已运行的主实例（见下方 single-instance 依赖）
tauri-plugin-deep-link = "2"
# 单实例插件（带 deep-link feature：新实例启动时把 deeplink URL 转发给主实例）
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# 重启主进程（更新文件替换完成后调用 relaunch）
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["sync", "rt", "macros", "process", "net", "io-util"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "multipart", "gzip", "rustls-tls"] }
# 加载操作系统信任的根证书（TLS 信任源 system 模式）
# 注：v0.8.x 对应 rustls 0.23（与 reqwest 0.12 rustls-tls feature 匹配）
rustls-native-certs = "0.8"
# 证书内容校验（CA 属性/有效期），自定义根证书准入判断
x509-parser = "0.17"
sysinfo = "0.29"
# 枚举本机网络连接（列出监听端口，供 Frp 内网端口选择）
# 0.11+ 修复了 Linux 新版 libc（tcp_info 字段 tcpi_state）编译兼容问题
netstat2 = "0.11"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
futures-util = "0.3"
zip = "4"
regex = "1"
anyhow = "1"
chrono = "0.4"
urlencoding = "2.1"
url = "2"
once_cell = "1"
base64 = "0.22"
encoding_rs = "0.8"
# gzip 解压（NBT 文件通常为 gzip 压缩，如 player .dat / level.dat）
flate2 = "1"
# NBT 解析（替代早期手动实现；simdnbt 依赖 nightly portable_simd 不可用，改用 fastnbt）
# fastnbt 2.x：stable 兼容，serde 设计，社区验证，支持嵌套 TAG_List / 空 compound / 超大数组
fastnbt = "2"
# 文件系统监听（用于 mods 目录自动刷新）
notify = "8"
# SQLite（实验性功能聊天记录存储；bundled=静态编译 SQLite，运行时无需动态库）
# 惰性初始化：仅在用户开启实验性功能时才创建数据库文件并与建表
rusqlite = { version = "0.40", features = ["bundled"] }

# 联机功能加密依赖（MoSign-v1 协议 + ECIES 加密信封）
# Ed25519 签名（设备身份与注册签名）
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
# X25519 ECDH 密钥协商（登录会话密钥派生 + ECIES 信封）
x25519-dalek = { version = "2", features = ["static_secrets"] }
# HKDF-SHA256 密钥派生（mosign-v1-session-key / mosign-v1-ecies-envelope）
hkdf = "0.12"
# HMAC-SHA256（登录签名，密钥为 ECDH 派生的 session_key）
hmac = "0.12"
# AES-256-GCM（登录 content 加密 + ECIES 信封 payload 加密）
aes-gcm = "0.10"
# RSA-OAEP（注册时 content 加密，需内置云端 RSA 公钥）
rsa = "0.9"
# 随机数生成（密钥生成、nonce、签名）
rand = "0.8"
# PEM 格式密钥解析（内置云端 RSA 公钥 PEM）
pem = "3"

# Frp 认证体系：token 经 SDK 内置 DES 加密后存文件（`<base_dir>/frp/auth/{provider_id}.json`），
# 替代原 keyring（OS 密钥存储）。文件随实例数据目录迁移，Unix 下 0o600 权限。

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Win32 API（用于游戏窗口标题修改、权限收紧等）
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_UI_Shell",
] }

# Unix 平台（macOS / Linux）依赖
# libc: setpgid / killpg 用于 frpc 进程组管理（对应 Windows Job Object）
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 非 Windows 平台（macOS / Linux）依赖
# 自动更新官方 plugin：Windows 便携版走自实现 updater（updater.exe 替换 + 退出时延迟安装，
# 见 commands/system/updater/install_windows.rs），官方 plugin 仅 macOS/Linux 使用
# （见 commands/system/updater/install_unix.rs 转发），故按平台条件引入，Windows 不链接
[target.'cfg(not(target_os = "windows"))'.dependencies]
tauri-plugin-updater = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
# thin LTO：相比 fat LTO + codegen-units=1 大幅缩短 CI 编译/链接耗时，
# 产物体积与性能影响极小（opt-level = "s" + strip 仍保证体积）
lto = "thin"
opt-level = "s"
strip = true
