[package]
name = "mo-launch"
version = "0.1.0"
description = "Modern Minecraft Launcher"
authors = ["MoTeam"]
license = "MIT"
repository = "https://github.com/MoTeam-cn/MoLaunch"
edition = "2021"

[lib]
name = "mo_launch_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# cubiomes 现在通过 Emscripten (emcc) 编译为 WebAssembly（见 build.rs），
# 不再使用 cc crate 编译为静态库——前端通过 WASM 直接调用，无需 Rust FFI 中转

[dependencies]
# 启用 devtools feature：让 release 构建也支持 open_devtools() 调用
# （Tauri 默认仅在 debug 构建开启 devtools；测试版需要在开发者模式开启时
# 通过设置页按钮调出 devtools 用于排查问题，故 release 也需开启）
# 安全约束：open_devtools() 后端 action 内部校验 is_developer_unlocked() &&
# is_developer_mode()，普通用户无法触发
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
# 自动更新（客户端检测/下载/校验/启动 NSIS installer 子程序）
# See: docs/updater/design.md §4.1.1
tauri-plugin-updater = "2"
# 重启主进程（更新文件替换完成后调用 relaunch）
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["sync", "rt", "macros", "process", "net", "io-util"] }
log = "0.4"
env_logger = "0.10"
thiserror = "1.0"
libloading = "0.8"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "multipart", "gzip", "rustls-tls"] }
# WebSocket 服务器（下载进度推送，替代前端轮询）
# tokio-tungstenite 0.21 对应 tungstenite 0.21（与 tokio 1.x 兼容）
tokio-tungstenite = "0.21"
# 加载操作系统信任的根证书（TLS 信任源 system 模式）
# 注：v0.6.x 对应 rustls 0.21（与 reqwest 0.11 rustls-tls feature 匹配）；
#     v0.7.x 对应 rustls 0.22+，不兼容 reqwest 0.11
rustls-native-certs = "0.6"
sysinfo = "0.29"
sha1 = "0.10"
sha2 = "0.10"
md5 = "0.7"
hex = "0.4"
futures-util = "0.3"
zip = "2"
regex = "1"
anyhow = "1"
chrono = "0.4"
urlencoding = "2.1"
once_cell = "1"
base64 = "0.22"
encoding_rs = "0.8"
# gzip 解压（NBT 文件通常为 gzip 压缩，如 player .dat / level.dat）
flate2 = "1"
# NBT 解析（替代早期手动实现；simdnbt 依赖 nightly portable_simd 不可用，改用 fastnbt）
# fastnbt 2.x：stable 兼容，serde 设计，社区验证，支持嵌套 TAG_List / 空 compound / 超大数组
fastnbt = "2"
# 文件系统监听（用于 mods 目录自动刷新）
notify = "8"

# 联机功能加密依赖（MoSign-v1 协议 + ECIES 加密信封）
# Ed25519 签名（设备身份与注册签名）
ed25519-dalek = { version = "2", features = ["rand_core", "pkcs8"] }
# X25519 ECDH 密钥协商（登录会话密钥派生 + ECIES 信封）
x25519-dalek = { version = "2", features = ["static_secrets"] }
# HKDF-SHA256 密钥派生（mosign-v1-session-key / mosign-v1-ecies-envelope）
hkdf = "0.12"
# HMAC-SHA256（登录签名，密钥为 ECDH 派生的 session_key）
hmac = "0.12"
# AES-256-GCM（登录 content 加密 + ECIES 信封 payload 加密）
aes-gcm = "0.10"
# RSA-OAEP（注册时 content 加密，需内置云端 RSA 公钥）
rsa = "0.9"
# 随机数生成（密钥生成、nonce、签名）
rand = "0.8"
# PEM 格式密钥解析（内置云端 RSA 公钥 PEM）
pem = "3"

# 虚拟网卡（阶段三：TUN 接口管理，跨平台 TUN/TAP 库）
# Windows 底层为 Wintun 驱动，需随程序分发 wintun.dll
# Linux/macOS 需 root 或 CAP_NET_ADMIN 权限
tun-rs = { version = "2", features = ["async_tokio"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Win32 API（用于游戏窗口标题修改）
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Shell",
] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
