[package]
name = "molaunch-updater"
version = "0.1.0"
description = "MoLaunch Windows 便携版更新器（独立子进程）"
edition = "2021"
license = "MIT"

[[bin]]
name = "molaunch_updater"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
ed25519-dalek = { version = "2", features = ["digest"] }
base64 = "0.22"
sha2 = "0.10"

[build-dependencies]
winres = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
