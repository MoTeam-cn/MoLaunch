[package]
name = "molaunch-updater"
version = "0.1.0"
description = "MoLaunch Windows 便携版更新器（独立子进程）"
edition = "2021"
license = "MIT"

[[bin]]
name = "molaunch_updater"
path = "src/main.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }
# 与 tauri-plugin-updater 同款的 minisign 签名验证库（零依赖）
minisign-verify = "0.2"
# 解码 tauri.conf.json 的 dW 开头公钥（base64 -> minisign.pub 两行文本）
base64 = "0.22"

[build-dependencies]
winres = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
