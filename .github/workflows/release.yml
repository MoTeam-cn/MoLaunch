name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '18'

permissions:
  contents: write

jobs:
  # 构建并上传到 S3 + 注册版本到 api-server
  build-and-upload:
    name: Build & Upload (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows（NSIS 安装包，updater 主格式）
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            bundle_type: nsis
          # macOS（app.tar.gz，updater 主格式）
          - platform: macos
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            bundle_type: app
          # Linux（AppImage，updater 主格式）
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            bundle_type: appimage

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/updater

      - name: Update version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Update package.json
          npm version $VERSION --no-git-tag-version
          # Update Cargo.toml
          cd src-tauri
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          fi
          # Update tauri.conf.json
          cd ..
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          fi

      # ===== Windows 便携版 updater.exe 预构建 =====
      # updater 是独立 Cargo 项目，主程序通过 include_bytes! 嵌入其编译产物。
      # 必须在 Build Tauri 之前完成，因为主程序编译时 build.rs 的 include_bytes! 需要该文件。
      # （build.rs 也有自动构建逻辑作为本地开发双保险，CI 显式构建可利用 rust-cache 加速）
      - name: Build updater.exe (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          echo "[CI] Building updater.exe..."
          cd src-tauri/updater
          cargo build --release
          cd ../..
          mkdir -p src-tauri/resources/updater
          cp src-tauri/updater/target/release/molaunch_updater.exe src-tauri/resources/updater/updater.exe
          echo "[CI] updater.exe 已生成:"
          ls -la src-tauri/resources/updater/updater.exe

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 启用签名（tauri-action 检测到此环境变量后自动对安装包签名，生成 .sig 文件）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          # Windows 优先使用 NSIS 安装包（而非 MSI），与 updater 协议一致
          updaterJsonPreferNsis: true
          # Windows 同时构建 NSIS 安装版 + portable 便携版（便携版由应用内 deeplink
          # 工具注册 molaunch:// 协议）；macOS/Linux 维持单一产物（app/appimage）
          args: ${{ matrix.platform == 'windows' && '--bundles nsis,portable' || '' }}

      # ===== 预签名上传 + 注册版本 =====
      # See: docs/updater/design.md §5.2 / §6 MoSign-v2 协议
      # CI 不接触 S3 凭证，通过 /v3/ci/presign-upload 获取 PUT presigned URL 直传。
      # GitHub Secrets 仅保留 MOLAUNCH_ACTION_PUSH_KEY 一个（MoSign-v2 签名密钥）。
      # 签名/上传/注册全部由 scripts/ci-upload.cjs 纯 Node.js 完成，消除 shell/Node
      # 数据传递导致的签名不一致问题（JSON.stringify 生成 body Buffer，签名和请求共用）。

      - name: Locate installer and signature
        id: locate
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          case "$PLATFORM" in
            windows)
              SETUP_FILE=$(find "$BUNDLE_DIR/nsis" -name "*-setup.exe" 2>/dev/null | head -1)
              # 便携版（Windows 专属）：Tauri portable 产物位于 nsis 目录，
              # 文件名形如 MoLaunch_1.0.0_x64_portable.exe
              PORTABLE_FILE=$(find "$BUNDLE_DIR/nsis" -name "*_portable.exe" 2>/dev/null | head -1)
              ;;
            macos)
              SETUP_FILE=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" ! -name "*.sig" 2>/dev/null | head -1)
              ;;
            linux)
              SETUP_FILE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" ! -name "*.sig" 2>/dev/null | head -1)
              ;;
          esac

          if [ -z "$SETUP_FILE" ] || [ ! -f "$SETUP_FILE" ]; then
            echo "::error::未找到安装包文件 (platform=$PLATFORM)"
            exit 1
          fi

          SIG_FILE="${SETUP_FILE}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::签名文件不存在: $SIG_FILE"
            exit 1
          fi

          echo "setup_file=$SETUP_FILE" >> $GITHUB_OUTPUT
          echo "sig_file=$SIG_FILE" >> $GITHUB_OUTPUT

          # Windows 便携版（可选，找到才输出；缺失则跳过上传 portable）
          if [ -n "$PORTABLE_FILE" ] && [ -f "$PORTABLE_FILE" ]; then
            PORTABLE_SIG="${PORTABLE_FILE}.sig"
            echo "portable_file=$PORTABLE_FILE" >> $GITHUB_OUTPUT
            echo "portable_sig=$PORTABLE_SIG" >> $GITHUB_OUTPUT
            echo "找到便携版: $PORTABLE_FILE"
          else
            echo "未找到 portable 产物（跳过便携版上传）"
          fi

      - name: Upload to S3 and register release
        shell: bash
        env:
          MOLAUNCH_ACTION_PUSH_KEY: ${{ secrets.MOLAUNCH_ACTION_PUSH_KEY }}
        run: |
          node scripts/ci-upload.cjs \
            "${{ steps.version.outputs.VERSION }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.bundle_type }}" \
            "${{ steps.locate.outputs.setup_file }}" \
            "${{ steps.locate.outputs.sig_file }}" \
            "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}"

      # Windows 便携版单独上传（bundle_type=portable，与 NSIS 安装版并存）
      - name: Upload portable build (Windows only)
        if: matrix.platform == 'windows' && steps.locate.outputs.portable_file != ''
        shell: bash
        env:
          MOLAUNCH_ACTION_PUSH_KEY: ${{ secrets.MOLAUNCH_ACTION_PUSH_KEY }}
        run: |
          node scripts/ci-upload.cjs \
            "${{ steps.version.outputs.VERSION }}" \
            "windows" \
            "${{ matrix.arch }}" \
            "portable" \
            "${{ steps.locate.outputs.portable_file }}" \
            "${{ steps.locate.outputs.portable_sig }}" \
            "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}"

  # 创建 GitHub Release 页面（仅历史回顾，不作为下载源）
  release:
    name: Create GitHub Release (history)
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.PREV_TAG }}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-merges --format="- %s ([%h](${REPO_URL}/commit/%H))" | head -50)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --format="- %s ([%h](${REPO_URL}/commit/%H))")
          fi

          {
            echo "LOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MoLaunch ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## MoLaunch ${{ steps.get_version.outputs.VERSION }}

            ### Downloads
            安装包已上传至 S3 存储桶，客户端可通过启动器「检查更新」自动获取。
            本页面仅用于发布历史回顾与变更记录。

            ### Commits
            ${{ steps.changelog.outputs.LOG }}

            ---
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 说明：
# 1. Tauri 代码签名：在 GitHub Settings > Secrets and variables > Actions > Repository secrets 配置：
#    - TAURI_SIGNING_PRIVATE_KEY           用于签名的私钥（通过 `tauri signer generate` 生成）
#    - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  生成私钥时设置的密码
#
# 2. S3 直传 + api-server 版本注册（MoSign-v2 鉴权，仅需 1 个 Secret）：
#    - MOLAUNCH_ACTION_PUSH_KEY            CI 推送专用密钥（生成：openssl rand -hex 32）
#                                         对应 api-server 配置项 ci.action_push_key
#                                         用途：MoSign-v2 HMAC 签名（/v3/ci/releases、/v3/ci/presign-upload）
#    S3 凭证（access_key_id / secret_access_key / region / bucket / endpoint）仅由 api-server 持有，
#    CI 通过 POST /v3/ci/presign-upload 换取 PUT presigned URL 后直接上传文件到 S3，
#    全程不接触 S3 凭证，无需在 GitHub Secrets 单独配置。
#
# 3. 上传/签名/注册逻辑由 scripts/ci-upload.cjs 纯 Node.js 实现：
#    - JSON.stringify() 生成 body Buffer，签名和 HTTP 请求共用同一 Buffer，消除签名不一致
#    - 无 heredoc / curl / openssl / shell 变量展开，行为确定
#    - 支持 S3 307 临时重定向
#
# 4. 安装包上传路径规范：s3://{bucket}/updater/v{version}/{platform}/{filename}
#    platform 取值：windows / macos / linux（与数据库 app_releases.platform 一致）
#    客户端查询 /v1/updates/manifest 时由 api-server 动态生成 GET presigned URL（1h 有效）
