name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '18'

permissions:
  contents: write

jobs:
  # 构建并上传到 S3 + 注册版本到 api-server
  build-and-upload:
    name: Build & Upload (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows（NSIS 安装包，updater 主格式）
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            bundle_type: nsis
          # macOS（app.tar.gz，updater 主格式）
          - platform: macos
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            bundle_type: app
          # Linux（AppImage，updater 主格式）
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            bundle_type: appimage

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev libglib2.0-dev

      - name: Install frontend dependencies
        run: npm install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/updater

      - name: Update version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          # Update package.json
          npm version $VERSION --no-git-tag-version
          # Update Cargo.toml
          cd src-tauri
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          else
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          fi
          # Update tauri.conf.json
          cd ..
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          else
            sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
          fi

      # ===== Windows 便携版 updater.exe 预构建 =====
      # updater 是独立 Cargo 项目，主程序通过 include_bytes! 嵌入其编译产物。
      # 必须在 Build Tauri 之前完成，因为主程序编译时 build.rs 的 include_bytes! 需要该文件。
      # （build.rs 也有自动构建逻辑作为本地开发双保险，CI 显式构建可利用 rust-cache 加速）
      - name: Build updater.exe (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          echo "[CI] Building updater.exe..."
          cd src-tauri/updater
          cargo build --release
          cd ../..
          mkdir -p src-tauri/resources/updater
          cp src-tauri/updater/target/release/molaunch_updater.exe src-tauri/resources/updater/updater.exe
          echo "[CI] updater.exe 已生成:"
          ls -la src-tauri/resources/updater/updater.exe

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 启用签名（tauri-action 检测到此环境变量后自动对安装包签名，生成 .sig 文件）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          # Windows 优先使用 NSIS 安装包（而非 MSI），与 updater 协议一致
          updaterJsonPreferNsis: true

      # ===== 预签名上传 + 注册版本 =====
      # See: docs/updater/design.md §5.2 / §6 MoSign-v2 协议
      # CI 不接触 S3 凭证，通过 /v3/ci/presign-upload 获取 PUT presigned URL 直传。
      # GitHub Secrets 仅保留 MOLAUNCH_ACTION_PUSH_KEY 一个（MoSign-v2 签名密钥）。

      - name: Upload to S3 and register release
        shell: bash
        env:
          MOLAUNCH_ACTION_PUSH_KEY: ${{ secrets.MOLAUNCH_ACTION_PUSH_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          PLATFORM="${{ matrix.platform }}"

          # ===== 1. 定位安装包与签名文件 =====
          BUNDLE_DIR="src-tauri/target/release/bundle"
          case "$PLATFORM" in
            windows)
              SETUP_FILE=$(find "$BUNDLE_DIR/nsis" -name "*-setup.exe" 2>/dev/null | head -1)
              ;;
            macos)
              SETUP_FILE=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" ! -name "*.sig" 2>/dev/null | head -1)
              ;;
            linux)
              SETUP_FILE=$(find "$BUNDLE_DIR/appimage" -name "*.AppImage" ! -name "*.sig" 2>/dev/null | head -1)
              ;;
          esac

          if [ -z "$SETUP_FILE" ] || [ ! -f "$SETUP_FILE" ]; then
            echo "::error::未找到安装包文件 (platform=$PLATFORM)"
            exit 1
          fi

          SIG_FILE="${SETUP_FILE}.sig"
          if [ ! -f "$SIG_FILE" ]; then
            echo "::error::签名文件不存在: $SIG_FILE"
            exit 1
          fi

          SETUP_FILENAME=$(basename "$SETUP_FILE")
          SIG_FILENAME=$(basename "$SIG_FILE")

          # .sig 文件内容即为 base64 签名字符串（tauri signer 输出格式）
          SIGNATURE_B64=$(tr -d '\n\r ' < "$SIG_FILE")

          # 文件大小（跨平台 stat 兼容）
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            FILE_SIZE=$(stat -f%z "$SETUP_FILE")
          else
            FILE_SIZE=$(stat -c%s "$SETUP_FILE")
          fi

          # ===== 2. 批量获取 S3 预签名上传 URL =====
          # POST /v3/ci/presign-upload，body = {version, platform, filenames: [setup, sig]}
          cat > presign-payload.json <<EOF
          {
            "version": "${VERSION}",
            "platform": "${PLATFORM}",
            "filenames": ["${SETUP_FILENAME}", "${SIG_FILENAME}"]
          }
          EOF

          PRESIGN_TIMESTAMP=$(date +%s)
          PRESIGN_NONCE=$(openssl rand -hex 16)
          PRESIGN_BODY_SHA256=$(openssl dgst -sha256 -r presign-payload.json | awk '{print $1}')
          PRESIGN_STRING_TO_SIGN="POST\n/v3/ci/presign-upload\n${PRESIGN_TIMESTAMP}\n${PRESIGN_NONCE}\n${PRESIGN_BODY_SHA256}"
          PRESIGN_SIGNATURE=$(printf "%b" "${PRESIGN_STRING_TO_SIGN}" | openssl dgst -sha256 -hmac "${MOLAUNCH_ACTION_PUSH_KEY}" | awk '{print $NF}')

          echo "请求预签名上传 URL（MoSign-v2 鉴权）..."
          PRESIGN_HTTP_STATUS=$(curl -sS -o presign-response.json -w "%{http_code}" \
            -X POST "https://api.molaunch.moiu.cn/v3/ci/presign-upload" \
            -H "Content-Type: application/json" \
            -H "X-MoSign-Version: MoSign-v2" \
            -H "X-MoSign-Timestamp: ${PRESIGN_TIMESTAMP}" \
            -H "X-MoSign-Nonce: ${PRESIGN_NONCE}" \
            -H "X-MoSign-Signature: ${PRESIGN_SIGNATURE}" \
            -d @presign-payload.json)

          echo "预签名响应 (HTTP $PRESIGN_HTTP_STATUS):"
          cat presign-response.json

          if [ "$PRESIGN_HTTP_STATUS" != "200" ]; then
            echo "::error::获取预签名 URL 失败 (HTTP $PRESIGN_HTTP_STATUS)"
            exit 1
          fi

          # ===== 3. 解析响应，用 curl PUT 直传到 S3 =====
          # 用 Node.js 解析 JSON 响应（跨平台兼容，无需 jq）
          node <<NODE_SCRIPT
          const fs = require('fs');
          const resp = JSON.parse(fs.readFileSync('presign-response.json', 'utf8'));
          if (resp.code !== 1 || !resp.data || !Array.isArray(resp.data.uploads)) {
            console.error('::error::预签名响应格式异常:', JSON.stringify(resp));
            process.exit(1);
          }
          // 输出 upload_url 和 download_key 到临时文件供 bash 读取
          const map = {};
          for (const item of resp.data.uploads) {
            map[item.filename] = item;
          }
          fs.writeFileSync('presign-map.json', JSON.stringify(map));
          console.log('已解析 ' + resp.data.uploads.length + ' 个上传 URL，有效期 ' + resp.data.expires_in + ' 秒');
          NODE_SCRIPT

          SETUP_UPLOAD_URL=$(node -e "const m=require('./presign-map.json');process.stdout.write(m['${SETUP_FILENAME}'].upload_url)")
          SETUP_DOWNLOAD_KEY=$(node -e "const m=require('./presign-map.json');process.stdout.write(m['${SETUP_FILENAME}'].download_key)")
          SIG_UPLOAD_URL=$(node -e "const m=require('./presign-map.json');process.stdout.write(m['${SIG_FILENAME}'].upload_url)")

          echo "上传安装包: $SETUP_FILE -> S3 (key=$SETUP_DOWNLOAD_KEY)"
          curl -sS -X PUT --upload-file "$SETUP_FILE" "$SETUP_UPLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "::error::安装包上传失败"
            exit 1
          fi

          echo "上传签名文件: $SIG_FILE -> S3"
          curl -sS -X PUT --upload-file "$SIG_FILE" "$SIG_UPLOAD_URL"
          if [ $? -ne 0 ]; then
            echo "::error::签名文件上传失败"
            exit 1
          fi

          echo "S3 上传完成"

          # ===== 4. 注册版本到 api-server =====
          # download_url 传 S3 对象 key（相对路径），api-server 查询时动态生成 presigned URL
          cat > release-payload.json <<EOF
          {
            "version": "${VERSION}",
            "channel": "stable",
            "platform": "${PLATFORM}",
            "arch": "${{ matrix.arch }}",
            "bundle_type": "${{ matrix.bundle_type }}",
            "download_url": "${SETUP_DOWNLOAD_KEY}",
            "signature": "${SIGNATURE_B64}",
            "file_size": ${FILE_SIZE},
            "file_hash": "",
            "release_notes": "",
            "release_url": "https://github.com/${{ github.repository }}/releases/tag/v${VERSION}",
            "rollout_pct": 100,
            "force_update": false,
            "min_version": ""
          }
          EOF

          # ===== MoSign-v2 签名 =====
          # See: docs/updater/design.md §6 MoSign-v2 协议
          # string-to-sign = METHOD\nPATH\nTIMESTAMP\nNONCE\nBODY_SHA256_HEX
          # signature = HMAC-SHA256(action_push_key, string_to_sign).hex()
          TIMESTAMP=$(date +%s)
          NONCE=$(openssl rand -hex 16)
          BODY_SHA256=$(openssl dgst -sha256 -r release-payload.json | awk '{print $1}')
          STRING_TO_SIGN="POST\n/v3/ci/releases\n${TIMESTAMP}\n${NONCE}\n${BODY_SHA256}"
          SIGNATURE=$(printf "%b" "${STRING_TO_SIGN}" | openssl dgst -sha256 -hmac "${MOLAUNCH_ACTION_PUSH_KEY}" | awk '{print $NF}')

          echo "MoSign-v2 签名参数："
          echo "  timestamp: ${TIMESTAMP}"
          echo "  nonce: ${NONCE}"
          echo "  body_sha256: ${BODY_SHA256}"

          echo "注册版本到 api-server（MoSign-v2 鉴权）..."
          HTTP_STATUS=$(curl -sS -o register-response.txt -w "%{http_code}" \
            -X POST "https://api.molaunch.moiu.cn/v3/ci/releases" \
            -H "Content-Type: application/json" \
            -H "X-MoSign-Version: MoSign-v2" \
            -H "X-MoSign-Timestamp: ${TIMESTAMP}" \
            -H "X-MoSign-Nonce: ${NONCE}" \
            -H "X-MoSign-Signature: ${SIGNATURE}" \
            -d @release-payload.json)

          echo "注册响应 (HTTP $HTTP_STATUS):"
          cat register-response.txt

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::版本注册失败 (HTTP $HTTP_STATUS)"
            exit 1
          fi

          echo "版本 ${VERSION} (${PLATFORM}) 已注册到 api-server"

  # 创建 GitHub Release 页面（仅历史回顾，不作为下载源）
  release:
    name: Create GitHub Release (history)
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      - name: Generate changelog from commits
        id: changelog
        run: |
          PREV_TAG="${{ steps.prev_tag.outputs.PREV_TAG }}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --oneline --no-merges --format="- %s ([%h](${REPO_URL}/commit/%H))" | head -50)
          else
            LOG=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --format="- %s ([%h](${REPO_URL}/commit/%H))")
          fi

          {
            echo "LOG<<EOF"
            echo "$LOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: MoLaunch ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## MoLaunch ${{ steps.get_version.outputs.VERSION }}

            ### Downloads
            安装包已上传至 S3 存储桶，客户端可通过启动器「检查更新」自动获取。
            本页面仅用于发布历史回顾与变更记录。

            ### Commits
            ${{ steps.changelog.outputs.LOG }}

            ---
            See [CHANGELOG.md](CHANGELOG.md) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# 说明：
# 1. Tauri 代码签名：在 GitHub Settings > Secrets and variables > Actions > Repository secrets 配置：
#    - TAURI_SIGNING_PRIVATE_KEY           用于签名的私钥（通过 `tauri signer generate` 生成）
#    - TAURI_SIGNING_PRIVATE_KEY_PASSWORD  生成私钥时设置的密码
#
# 2. S3 直传 + api-server 版本注册（MoSign-v2 鉴权，仅需 1 个 Secret）：
#    - MOLAUNCH_ACTION_PUSH_KEY            CI 推送专用密钥（生成：openssl rand -hex 32）
#                                         对应 api-server 配置项 ci.action_push_key
#                                         用途：MoSign-v2 HMAC 签名（/v3/ci/releases、/v3/ci/presign-upload）
#    S3 凭证（access_key_id / secret_access_key / region / bucket / endpoint）仅由 api-server 持有，
#    CI 通过 POST /v3/ci/presign-upload 换取 PUT presigned URL 后直接 curl 上传文件到 S3，
#    全程不接触 S3 凭证，无需在 GitHub Secrets 单独配置。
#
# 3. 安装包上传路径规范：s3://{bucket}/updater/v{version}/{platform}/{filename}
#    platform 取值：windows / macos / linux（与数据库 app_releases.platform 一致）
#    客户端查询 /v1/updates/manifest 时由 api-server 动态生成 GET presigned URL（1h 有效）
