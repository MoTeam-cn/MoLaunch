# 发布工作流
#
# 不再由 tag 直接触发：版本同步工作流（version-sync.yml）在推送 v* 标签后
# 先确保仓库内版本号文件与标签一致，再通过 workflow_call 激活本工作流，
# 版本号由调用方传入（inputs.version，不带 v 前缀）。
# 同时也支持在 Actions 页面手动指定版本号运行。

name: Release

on:
  workflow_call:
    inputs:
      version:
        description: '发布版本号（不带 v 前缀，例如 0.3.6）'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（不带 v 前缀，例如 0.3.6）'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # Node 22：@vitejs/plugin-vue@6 的 getHash 使用 crypto.hash（Node 21.7+ 才有），Node 18 下前端构建失败
  NODE_VERSION: '22'

permissions:
  contents: write

jobs:
  # 构建并上传到 S3 + 注册版本到 api-server
  build-and-upload:
    name: Build & Upload (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows（NSIS 安装包，updater 主格式）
          - platform: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            arch: x86_64
            bundle_type: nsis
          # macOS（app.tar.gz，updater 主格式）
          - platform: macos
            os: macos-latest
            target: aarch64-apple-darwin
            arch: aarch64
            bundle_type: app
          # macOS（Intel x86_64；在 arm 版 runner 上交叉编译。
          # Intel Mac 此前只有 aarch64 产物、云端从未登记过 darwin-x86_64，等于拿不到更新）
          - platform: macos
            os: macos-latest
            target: x86_64-apple-darwin
            arch: x86_64
            bundle_type: app
          # Linux（AppImage，updater 主格式）
          - platform: linux
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            arch: x86_64
            bundle_type: appimage

    steps:
      - uses: actions/checkout@v5
        with:
          # 全量历史：生成 release_notes（提交记录）与读取上一 tag 需要
          fetch-depth: 0
          # workflow_call 触发时 checkout 默认分支，构建版本同步工作流提交后的代码
          ref: ${{ github.event.repository.default_branch }}

      - name: Extract version
        id: version
        shell: bash
        run: echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT

      # 生成本次更新日志（release_notes），随版本注册一并上报 api-server，
      # 供启动器「检查更新」对话框展示本次更新内容。
      # 注意：提交多时 release_notes 可达几十 KB，不能走命令行参数（Windows CreateProcess
      # 参数列表约 32KB 上限会报 Argument list too long），故先 git log 重定向到临时文件，
      # 由 ci-upload.cjs 按文件路径读取。
      - name: Generate release notes from commits
        id: generate-notes
        shell: bash
        run: |
          VERSION_TAG="v${{ steps.version.outputs.VERSION }}"
          CUR_SHA=$(git rev-parse "${VERSION_TAG}^{commit}" 2>/dev/null || git rev-parse HEAD)
          # 排除滚动通道 tag（channel-beta / channel-alpha，仅承载 latest.json），
          # 否则提交区间会以清单发布点为准，更新日志错位
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude='channel-*' "${CUR_SHA}^" 2>/dev/null || echo "")
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.txt"
          {
            echo "## MoLaunch ${{ steps.version.outputs.VERSION }}"
            echo ""
            if [ -z "$PREV_TAG" ]; then
              git log --oneline --no-merges --format="- %s ([%h](${REPO_URL}/commit/%H))" "$CUR_SHA" | head -50
            else
              git log "${PREV_TAG}..${CUR_SHA}" --oneline --no-merges --format="- %s ([%h](${REPO_URL}/commit/%H))"
            fi
          } > "$NOTES_FILE"
          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 缓存 APT 包（.deb）：命中时跳过 apt-get update 与下载，直接安装缓存包，
      # 避免每次运行重复下载 libwebkit2gtk-4.1-dev 等大包（数百 MB）导致该步骤卡 10 分钟。
      # execute_install_scripts 恢复缓存时执行 postinst 脚本（webkit 等包需要）。
      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'linux'
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential clang curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
          version: 1.0
          execute_install_scripts: true

      - name: Install frontend dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # 私有协议库（molaunch-protocol）需要凭据才能拉取；用 PAT 改写 https 前缀
      - name: Authorize private protocol repo
        run: git config --global url."https://x-access-token:${{ secrets.PROTOCOL_REPO_TOKEN }}@github.com/".insteadOf "https://github.com/"


      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-tauri/updater

      # ===== Windows 便携版 updater.exe 预构建 =====
      # updater 是独立 Cargo 项目，主程序通过 include_bytes! 嵌入其编译产物。
      # 必须在 Build Tauri 之前完成，因为主程序编译时 build.rs 的 include_bytes! 需要该文件。
      # （build.rs 也有自动构建逻辑作为本地开发双保险，CI 显式构建可利用 rust-cache 加速）
      - name: Build updater.exe (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          echo "[CI] Building updater.exe..."
          cd src-tauri/updater
          cargo build --release
          cd ../..
          mkdir -p src-tauri/resources/updater
          cp src-tauri/updater/target/release/molaunch_updater.exe src-tauri/resources/updater/updater.exe
          echo "[CI] updater.exe 已生成:"
          ls -la src-tauri/resources/updater/updater.exe

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 启用签名（tauri-action 检测到此环境变量后自动对安装包签名，生成 .sig 文件）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 微软登录 Client ID（编译期注入，见 src-tauri/src/minecraft/auth/microsoft/config.rs 的
          # option_env!("MOLAUNCH_MS_CLIENT_ID")）。配置后走 v2.0 端点 + Device Code Flow；
          # 留空时使用 Minecraft 官方 ID + 旧版端点。
          # GitHub Secrets 配置名：MOLAUNCH_MS_CLIENT_ID
          MOLAUNCH_MS_CLIENT_ID: ${{ secrets.MOLAUNCH_MS_CLIENT_ID }}
          # 启动上报签名密钥（编译期注入，见 src-tauri/src/utils/update_sign.rs 的
          # option_env!("MOLAUNCH_UPDATE_SIGN_KEY")）。必须与 api-server 的
          # update_check.sign_keys 同值：不一致则 ping 全部 403；未注入则 ping 被静默跳过。
          # GitHub Secrets 配置名：MOLAUNCH_UPDATE_SIGN_KEY
          MOLAUNCH_UPDATE_SIGN_KEY: ${{ secrets.MOLAUNCH_UPDATE_SIGN_KEY }}
          # 匿名错误上报接入参数（编译期注入，见 src-tauri/src/telemetry/config.rs）。
          # 三个 secret 任一缺失则功能自动关闭；总开关 TELEMETRY_ENABLED 亦需为 true。
          MOLAUNCH_SLS_ENDPOINT: ${{ secrets.MOLAUNCH_SLS_ENDPOINT }}
          MOLAUNCH_SLS_PROJECT: ${{ secrets.MOLAUNCH_SLS_PROJECT }}
          MOLAUNCH_SLS_LOGSTORE: ${{ secrets.MOLAUNCH_SLS_LOGSTORE }}
        with:
          tauriScript: npx tauri
          # Windows 优先使用 NSIS 安装包（而非 MSI），与 updater 协议一致
          updaterJsonPreferNsis: true
          # Windows 构建 NSIS 安装版；macOS/Linux 维持单一产物（app/appimage）。
          # Windows 用 NSIS；macOS Intel 需显式指定交叉编译目标（产物落在 target/<triple>/release）
          args: ${{ matrix.platform == 'windows' && '--bundles nsis' || (matrix.platform == 'macos' && matrix.arch == 'x86_64' && '--target x86_64-apple-darwin' || '') }}

      # ===== Windows 便携版 =====
      - name: Create portable build (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          BUNDLE_DIR="src-tauri/target/release/bundle/nsis"
          MAIN_BIN="src-tauri/target/release/MoLaunch.exe"
          PORTABLE_FILE="${BUNDLE_DIR}/MoLaunch_${VERSION}_x64.exe"
          if [ ! -f "$MAIN_BIN" ]; then
            echo "::error::release 主程序不存在: $MAIN_BIN"
            exit 1
          fi
          cp "$MAIN_BIN" "$PORTABLE_FILE"
          npx tauri signer sign "$PORTABLE_FILE"
          echo "[CI] 便携版已生成:"
          ls -la "$PORTABLE_FILE" "${PORTABLE_FILE}.sig"

      # ===== 预签名上传 + 注册版本 =====
      # CI 不接触 S3 凭证，通过 /v3/ci/presign-upload 获取 PUT presigned URL 直传。

      - name: Locate installer and signature
        id: locate
        shell: bash
        run: |
          PLATFORM="${{ matrix.platform }}"
          BUNDLE_DIR="src-tauri/target/release/bundle"
          case "$PLATFORM" in
            windows)
              SETUP_FILE=$(find "$BUNDLE_DIR/nsis" -name "*-setup.exe" 2>/dev/null | head -1)
              # 便携版（Windows 专属）：由 "Create portable build" 步骤复制到 nsis 目录，
              # 文件名形如 MoLaunch_1.0.0_x64.exe（不带 -setup / _portable 后缀，与安装版区分）
              PORTABLE_FILE=$(find "$BUNDLE_DIR/nsis" -name "*.exe" ! -name "*-setup.exe" 2>/dev/null | head -1)
              ;;
            macos)
              # 交叉编译时产物在 target/<triple>/release/bundle 下，故从 target 整体查找
              SETUP_FILE=$(find src-tauri/target -path "*bundle/macos*" -name "*.app.tar.gz" ! -name "*.sig" 2>/dev/null | head -1)
              # 双架构发版：文件名带架构后缀，避免 GitHub Release 资产与 S3 对象重名
              if [ -n "$SETUP_FILE" ] && [ -f "$SETUP_FILE" ]; then
                MACOS_SUFFIX=$([ "${{ matrix.arch }}" = "x86_64" ] && echo "x64" || echo "aarch64")
                MACOS_NEW="$(dirname "$SETUP_FILE")/MoLaunch_${{ steps.version.outputs.VERSION }}_${MACOS_SUFFIX}.app.tar.gz"
                if [ "$SETUP_FILE" != "$MACOS_NEW" ]; then
                  mv "$SETUP_FILE" "$MACOS_NEW"
                  if [ -f "${SETUP_FILE}.sig" ]; then
                    mv "${SETUP_FILE}.sig" "${MACOS_NEW}.sig"
                  fi
                  SETUP_FILE="$MACOS_NEW"
                  echo "[CI] macOS 产物已重命名: $SETUP_FILE"
                fi
              fi
              ;;
            linux)
              SETUP_FILE=$(find src-tauri/target -path "*bundle/appimage*" -name "*.AppImage" ! -name "*.sig" 2>/dev/null | head -1)
              ;;
          esac

          # macOS/Linux 安装包推云端，要求存在且带签名；
          # Windows 仅便携版推云端，setup 安装版只附加 GitHub Release，不要求 .sig
          if [ "$PLATFORM" != "windows" ]; then
            if [ -z "$SETUP_FILE" ] || [ ! -f "$SETUP_FILE" ]; then
              echo "::error::未找到安装包文件 (platform=$PLATFORM)"
              exit 1
            fi
            SIG_FILE="${SETUP_FILE}.sig"
            if [ ! -f "$SIG_FILE" ]; then
              echo "::error::签名文件不存在: $SIG_FILE"
              exit 1
            fi
            echo "setup_file=$SETUP_FILE" >> $GITHUB_OUTPUT
            echo "sig_file=$SIG_FILE" >> $GITHUB_OUTPUT
          fi

          # Windows 便携版：云端唯一 Windows 产物，必须存在且带签名
          if [ "$PLATFORM" == "windows" ]; then
            if [ -z "$PORTABLE_FILE" ] || [ ! -f "$PORTABLE_FILE" ]; then
              echo "::error::便携版产物不存在: $PORTABLE_FILE"
              exit 1
            fi
            PORTABLE_SIG="${PORTABLE_FILE}.sig"
            if [ ! -f "$PORTABLE_SIG" ]; then
              echo "::error::便携版签名不存在: $PORTABLE_SIG"
              exit 1
            fi
            echo "portable_file=$PORTABLE_FILE" >> $GITHUB_OUTPUT
            echo "portable_sig=$PORTABLE_SIG" >> $GITHUB_OUTPUT
          fi

      # Windows 便携版才推送云端（S3 + 注册）；setup 安装版不推存储，仅附加到 GitHub Release
      # （由 release job 下载 workflow artifact 后附加，见下方 release job）
      - name: Upload to S3 and register release
        if: matrix.platform != 'windows'
        shell: bash
        env:
          MOLAUNCH_ACTION_PUSH_KEY: ${{ secrets.MOLAUNCH_ACTION_PUSH_KEY }}
          MOLAUNCH_ACTION_PUSH_SERVER: ${{ secrets.MOLAUNCH_ACTION_PUSH_SERVER }}
        run: |
          node scripts/ci-upload.cjs \
            "${{ steps.version.outputs.VERSION }}" \
            "${{ matrix.platform }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.bundle_type }}" \
            "${{ steps.locate.outputs.setup_file }}" \
            "${{ steps.locate.outputs.sig_file }}" \
            "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}" \
            "${{ steps.generate-notes.outputs.notes_file }}"

      # Windows 便携版单独上传（bundle_type=portable，云端仅此一份 Windows 产物）
      - name: Upload portable build (Windows only)
        if: matrix.platform == 'windows' && steps.locate.outputs.portable_file != ''
        shell: bash
        env:
          MOLAUNCH_ACTION_PUSH_KEY: ${{ secrets.MOLAUNCH_ACTION_PUSH_KEY }}
          MOLAUNCH_ACTION_PUSH_SERVER: ${{ secrets.MOLAUNCH_ACTION_PUSH_SERVER }}
        run: |
          node scripts/ci-upload.cjs \
            "${{ steps.version.outputs.VERSION }}" \
            "windows" \
            "${{ matrix.arch }}" \
            "portable" \
            "${{ steps.locate.outputs.portable_file }}" \
            "${{ steps.locate.outputs.portable_sig }}" \
            "https://github.com/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.VERSION }}" \
            "${{ steps.generate-notes.outputs.notes_file }}"

      # Windows setup 安装版不推送云端（S3），仅作为 workflow artifact 传递，
      # 由 release job 附加到 GitHub Release（供用户手动下载安装）。
      # 不要求 .sig：Windows 更新走便携版 + 自研 updater.exe，setup 签名无用途。
      - name: Upload setup as workflow artifact (Windows only)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-setup
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error

      # macOS 安装包（app.tar.gz + .sig）作为 workflow artifact 传递，
      # 由 release job 附加到 GitHub Release（除 S3 外，提供手动下载入口）。
      # .sig 一并附加：macOS 更新走 updater 协议，用户可校验签名。
      - name: Upload macos package as workflow artifact (macOS only)
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v6
        with:
          # 双架构并行上传，artifact 名必须带架构，否则同名冲突
          name: macos-package-${{ matrix.arch }}
          path: |
            ${{ steps.locate.outputs.setup_file }}
            ${{ steps.locate.outputs.sig_file }}
          retention-days: 7
          if-no-files-found: error

      # Linux 安装包（AppImage + .sig）作为 workflow artifact 传递，
      # 由 release job 附加到 GitHub Release（除 S3 外，提供手动下载入口）。
      - name: Upload linux package as workflow artifact (Linux only)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v6
        with:
          name: linux-package
          path: |
            ${{ steps.locate.outputs.setup_file }}
            ${{ steps.locate.outputs.sig_file }}
          retention-days: 7
          if-no-files-found: error

      # Windows 便携版（MoLaunch_<ver>_x64.exe + .sig）作为 workflow artifact 传递，
      # 由 release job 附加到 GitHub Release（除 S3 外，提供手动下载入口）。
      - name: Upload portable as workflow artifact (Windows only)
        if: matrix.platform == 'windows' && steps.locate.outputs.portable_file != ''
        uses: actions/upload-artifact@v6
        with:
          name: windows-portable
          path: |
            ${{ steps.locate.outputs.portable_file }}
            ${{ steps.locate.outputs.portable_sig }}
          retention-days: 7
          if-no-files-found: error

  # 创建 GitHub Release 页面（历史回顾 + 承载 Windows setup / macOS / Linux 安装包下载）
  release:
    name: Create GitHub Release (history)
    needs: build-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # 检出发布 tag 对应的提交：提交区间、协作者统计、compare API 均以上一个 tag 为基准
          ref: v${{ inputs.version }}

      - name: Download Windows setup artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-setup
          path: artifacts/windows

      - name: Download macOS package artifact (aarch64)
        uses: actions/download-artifact@v8
        with:
          name: macos-package-aarch64
          path: artifacts/macos-aarch64

      - name: Download macOS package artifact (x86_64)
        uses: actions/download-artifact@v8
        with:
          name: macos-package-x86_64
          path: artifacts/macos-x86_64

      - name: Download Linux package artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-package
          path: artifacts/linux

      - name: Download Windows portable artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: artifacts/windows

      - name: List artifacts
        shell: bash
        run: |
          find artifacts -type f | sort
          echo "FILE_COUNT=$(find artifacts -type f | wc -l)" >> $GITHUB_OUTPUT

      - name: Get version
        id: get_version
        run: echo "VERSION=${{ inputs.version }}" >> $GITHUB_OUTPUT

      # 根据 tag 是否含预发布标识（-rc / -alpha / -beta / -preview / -test 等）判定 prerelease。
      # 含这些标识的版本发布为「预发布」（GitHub Release 标记 Prerelease），
      # 否则发布为正式版（latest）。
      - name: Check if prerelease
        id: prerelease
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          case "$VERSION" in
            *-alpha*|*-beta*|*-rc*|*-preview*|*-test*|*-snapshot*)
              echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Get previous tag
        id: prev_tag
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --exclude='channel-*' HEAD^ 2>/dev/null || echo "")
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_OUTPUT
          echo "Previous tag: $PREV_TAG"

      # 生成分类 changelog（作者的话 / 新增 / 修复 / 其他 / 协作者头像），
      # 逻辑在 scripts/generate-release-content.cjs，避免在 workflow 内堆叠脚本。
      - name: Generate changelog from commits
        id: changelog
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-release-content.cjs \
            "${{ steps.prev_tag.outputs.PREV_TAG }}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "${GITHUB_REPOSITORY}" \
            "$(git rev-parse HEAD)"

      # 生成 GitHub 更新源清单（latest.json）：启动器「检查更新源 = GitHub」时读取该资产。
      # 清单里的下载地址按 Release 资产的固定命名推导，签名取自随包的 .sig。
      - name: Generate update manifest
        id: manifest
        shell: bash
        env:
          NOTES: ${{ steps.changelog.outputs.NOTES }}
          FEATURES: ${{ steps.changelog.outputs.FEATURES }}
          FIXES: ${{ steps.changelog.outputs.FIXES }}
          OTHERS: ${{ steps.changelog.outputs.OTHERS }}
        run: |
          printf '%s\n\n%s\n\n%s\n\n%s\n' "$NOTES" "$FEATURES" "$FIXES" "$OTHERS" > "$RUNNER_TEMP/latest-notes.md"
          CHANNEL=$(node scripts/generate-update-manifest.cjs \
            "${{ steps.get_version.outputs.VERSION }}" \
            "${{ github.repository }}" \
            "artifacts" \
            "artifacts/latest.json" \
            "$RUNNER_TEMP/latest-notes.md")
          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          # workflow_call 触发时 GITHUB_REF 非 tag，必须显式指定 release 对应的 tag
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: MoLaunch ${{ steps.get_version.outputs.VERSION }}
          body: |
            ## MoLaunch ${{ steps.get_version.outputs.VERSION }}

            ${{ steps.changelog.outputs.NOTES }}

            ${{ steps.changelog.outputs.BREAKING }}

            ${{ steps.changelog.outputs.FEATURES }}

            ${{ steps.changelog.outputs.FIXES }}

            ${{ steps.changelog.outputs.OTHERS }}

            ${{ steps.changelog.outputs.CONTRIBUTORS }}

            ---
            See [CHANGELOG.md](CHANGELOG.md) for details.
          files: |
            artifacts/windows/*-setup.exe
            artifacts/windows/*_x64.exe
            artifacts/windows/*.sig
            artifacts/macos*/*.app.tar.gz
            artifacts/macos*/*.sig
            artifacts/linux/*.AppImage
            artifacts/linux/*.sig
            artifacts/latest.json
          draft: false
          prerelease: ${{ steps.prerelease.outputs.IS_PRERELEASE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 预发布版本额外把清单推到滚动 tag（channel-beta / channel-alpha）：
      # GitHub 没有「最新预发布」的固定路径，非 stable 通道只能靠固定 tag 承载。
      # 标记 prerelease 且 make_latest=false，确保它永远不会被 /releases/latest 命中，
      # stable 通道仍由正式 Release 里的 latest.json 提供。
      - name: Publish rolling channel manifest
        if: steps.prerelease.outputs.IS_PRERELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: channel-${{ steps.manifest.outputs.channel }}
          name: MoLaunch 通道清单（${{ steps.manifest.outputs.channel }}）
          body: |
            该 Release 仅承载 ${{ steps.manifest.outputs.channel }} 通道的更新清单（latest.json），
            随每次预发布自动覆盖，不是可安装版本，请勿下载。
          files: artifacts/latest.json
          draft: false
          prerelease: true
          make_latest: 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =====================================================================
  # 夸克网盘分发：把本版产物按平台打成 zip 上传
  #
  # 账号与 token 由 api-server 持有（/v3/ci/quark/*，开放平台签名 + 自动刷新），
  # CI 只做「取采样范围 → 换预签名直传 URL → 直传分片 → 回调合并」，见 scripts/quark-upload.cjs。
  # 需要 secret MOLAUNCH_ACTION_PUSH_KEY / MOLAUNCH_ACTION_PUSH_SERVER（与 ci-upload 同一套）。
  # 未配置时自动跳过；上传失败不影响已经发布的 Release（continue-on-error）。
  # =====================================================================
  quark-upload:
    name: Upload packages to Quark Pan
    needs: release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Check push key configured
        id: guard
        run: |
          if [ -z "${{ secrets.MOLAUNCH_ACTION_PUSH_KEY }}" ] || [ -z "${{ secrets.MOLAUNCH_ACTION_PUSH_SERVER }}" ]; then
            echo "::notice::未配置 MOLAUNCH_ACTION_PUSH_KEY / MOLAUNCH_ACTION_PUSH_SERVER，跳过夸克网盘上传"
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Download build artifacts
        if: steps.guard.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          path: dist

      # 打包规则（与网盘目录一一对应）：
      #   quark-out/windows/MoLaunch_<ver>_Windows-setup.zip     安装版 exe + sig
      #   quark-out/windows/MoLaunch_<ver>_Windows-portable.zip  便携版 exe + sig
      #   quark-out/macos/MoLaunch_<ver>_macOS.zip               两种架构的 app.tar.gz + sig
      #   quark-out/linux/MoLaunch_<ver>_Linux.zip               AppImage + sig
      # 平台子目录名会被服务端映射成 Windows / macOS / Linux，CI 不传中文目录名。
      - name: Pack per-platform zips
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          OUT="$PWD/quark-out"
          mkdir -p "$OUT/windows" "$OUT/macos" "$OUT/linux"
          pack() {
            local dest="$1"; shift
            local tmp
            tmp=$(mktemp -d)
            for d in "$@"; do
              [ -d "dist/$d" ] && cp -r "dist/$d/." "$tmp/"
            done
            if [ -n "$(ls -A "$tmp")" ]; then
              ( cd "$tmp" && zip -qr "$dest" . )
              echo "打包 $(basename "$dest")（$(du -h "$dest" | cut -f1)）"
            else
              echo "::warning::$(basename "$dest") 没有可打包内容，跳过"
            fi
            rm -rf "$tmp"
          }
          # Windows 拆成安装版 / 便携版两个 zip
          mkdir -p dist/windows-setup-only dist/windows-portable-only
          cp dist/windows-setup/*-setup.exe* dist/windows-setup-only/ 2>/dev/null || true
          cp dist/windows-portable/* dist/windows-portable-only/ 2>/dev/null || true
          pack "$OUT/windows/MoLaunch_${VERSION}_Windows-setup.zip" windows-setup-only
          pack "$OUT/windows/MoLaunch_${VERSION}_Windows-portable.zip" windows-portable-only
          pack "$OUT/macos/MoLaunch_${VERSION}_macOS.zip" macos-package-aarch64 macos-package-x86_64
          pack "$OUT/linux/MoLaunch_${VERSION}_Linux.zip" linux-package
          find "$OUT" -type f | sort
      - name: Upload to Quark Pan
        if: steps.guard.outputs.skip != 'true'
        env:
          MOLAUNCH_ACTION_PUSH_KEY: ${{ secrets.MOLAUNCH_ACTION_PUSH_KEY }}
          MOLAUNCH_ACTION_PUSH_SERVER: ${{ secrets.MOLAUNCH_ACTION_PUSH_SERVER }}
        run: node scripts/quark-upload.cjs quark-out --version "${{ inputs.version }}"
