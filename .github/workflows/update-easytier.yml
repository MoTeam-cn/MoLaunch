# 自动更新 easytier-core 嵌入式资源（联机虚拟组网）
#
# 每日（UTC 04:00）对比 GitHub Releases 最新 stable 与 build_script/easytier.rs 记录的版本，
# 不一致则调用 scripts/update-easytier.ps1 下载 6 个平台包替换 src-tauri/resources/easytier/
# 并更新版本常量后提交（也可在 Actions 页面手动触发）。版本仅拉取 stable（releases/latest）。

name: Update EasyTier

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-easytier
  cancel-in-progress: false

jobs:
  update:
    name: Sync easytier-core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Check & update easytier-core
        id: update
        shell: pwsh
        run: ./scripts/update-easytier.ps1

      # Git for Windows 提交时按文件系统权限记录模式，Unix 侧二进制需显式加回执行位
      - name: Fix executable bits
        if: steps.update.outputs.updated == 'true'
        shell: bash
        run: chmod +x src-tauri/resources/easytier/linux/*/easytier-core src-tauri/resources/easytier/macos/*/easytier-core

      # 有更新才提交（无变化自动跳过），!c 跳过 CI
      - name: Commit updated binaries
        if: steps.update.outputs.updated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(easytier): 同步上游 v${{ steps.update.outputs.version }} easytier-core 产物 !c'
          file_pattern: 'src-tauri/resources/easytier/ src-tauri/build_script/easytier.rs'
