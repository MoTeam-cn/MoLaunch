# 自动维护 cubiomes WASM 产物
#
# 每日（UTC 04:00）检测 cubiomes 上游仓库（https://github.com/MoTeam-cn/cubiomes）更新：
# 与入库产物记录的源码 commit（src/assets/seedmap/cubiomes.upstream.txt）比对，有更新则
# 拉取 submodule 源码（cubiomes/，git submodule update --remote 追到上游最新）→ emcc 编译 →
# 提交新产物到 src/assets/seedmap/，submodule 指针变更随产物一并提交。
# 本工作流是产物的唯一维护入口（也可在 Actions 页面手动触发）。
#
# 编译复用 scripts/build-wasm.cjs（windows runner，与本地 npm run build:wasm 同一入口），
# 保证 emcc 参数一致；提交信息带 !c 跳过 CI 的重复验证。

name: Update Cubiomes

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-cubiomes
  cancel-in-progress: false

jobs:
  update:
    name: Build & Commit WASM
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      # 上游 HEAD commit 与产物记录比对：一致说明无更新，跳过编译
      - name: Check upstream update
        id: check
        shell: bash
        run: |
          UPSTREAM_SHA="$(git ls-remote https://github.com/MoTeam-cn/cubiomes.git HEAD | awk '{print $1}')"
          echo "upstream_sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          CURRENT=""
          if [ -f src/assets/seedmap/cubiomes.upstream.txt ]; then
            CURRENT="$(cat src/assets/seedmap/cubiomes.upstream.txt | tr -d '\r\n')"
          fi
          echo "current_sha=$CURRENT" >> "$GITHUB_OUTPUT"
          if [ -n "$CURRENT" ] && [ "$UPSTREAM_SHA" = "$CURRENT" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          fi
          echo "upstream=${UPSTREAM_SHA:0:12} current=${CURRENT:0:12}"

      # 源码由 submodule 提供：先按记录的 commit 拉取，再 update --remote 追到上游最新，
      # 保证编译源码与本次检测到的上游 HEAD 一致
      - name: Sync cubiomes submodule
        if: steps.check.outputs.up_to_date != 'true'
        run: |
          git submodule update --init --depth 1 cubiomes
          git submodule update --remote --depth 1 cubiomes

      - name: Setup Emscripten
        if: steps.check.outputs.up_to_date != 'true'
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: Compile WASM
        if: steps.check.outputs.up_to_date != 'true'
        run: npm run build:wasm

      # 编译成功才记录本次上游 commit，供下次比对
      - name: Record upstream commit
        if: steps.check.outputs.up_to_date != 'true'
        shell: bash
        run: echo "${{ steps.check.outputs.upstream_sha }}" > src/assets/seedmap/cubiomes.upstream.txt

      # 产物/记录有变化才提交（无变化自动跳过），!c 跳过 CI
      - name: Commit updated artifacts
        if: steps.check.outputs.up_to_date != 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore(cubiomes): 同步上游 ${{ steps.check.outputs.upstream_sha }} 编译产物 !c'
          file_pattern: 'src/assets/seedmap/ cubiomes'
