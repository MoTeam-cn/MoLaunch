name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src-tauri/tauri.conf.json'
      - 'Cargo.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src-tauri/tauri.conf.json'
      - 'Cargo.toml'
      - '.github/workflows/**'
  # 手动触发（Actions 页面 Run workflow 按钮）
  # ci.yml 本身不在 paths 过滤内，仅修改 workflow 文件不会自动触发 CI，需手动运行
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # 私有协议库走 git CLI 拉取：libgit2 不认 url.insteadOf，只有 CLI 能复用凭据改写
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  # Node 22：@vitejs/plugin-vue@6 的 getHash 使用 crypto.hash（Node 21.7+ 才有），Node 18 下前端构建失败
  NODE_VERSION: '22'

jobs:
  # 检查是否跳过 CI
  check-skip:
    name: Check Skip
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        # 通过 env 传递 commit message，避免直接插值到 bash 表达式
        # 原写法 "${{ github.event.head_commit.message }}" 在 message 含双引号 / $ / 反引号时
        # 会被 shell 二次解析（如 cmd /c start "" "<path>" 中的 > 被当作重定向）
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"!c"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # 前端检查
  frontend-check:
    name: Frontend Check
    permissions:
      contents: read
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Frontend build
        run: npm run build

      - name: Lint
        run: npm run lint
      
      - name: Type check
        run: npm run typecheck

      - name: Security audit (npm)
        run: npm audit --audit-level=high

  # Rust 格式检查
  rust-fmt:
    name: Rust Format
    permissions:
      contents: read
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: src-tauri

  # Rust Clippy 检查
  rust-clippy:
    name: Rust Clippy
    permissions:
      contents: read
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # 缓存 APT 包（.deb）：命中时跳过 apt-get update 与下载，直接安装缓存包，
      # 避免每次运行重复下载 libwebkit2gtk-4.1-dev 等大包（数百 MB）导致该步骤卡 10 分钟。
      - name: Install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential clang curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
          version: 1.0
          execute_install_scripts: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 私有协议库（molaunch-protocol）需要凭据：写 git 凭据文件并校验可访问
      - name: Authorize private protocol repo
        env:
          PROTOCOL_TOKEN: ${{ secrets.PROTOCOL_REPO_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$PROTOCOL_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git config --global url."https://x-access-token:$PROTOCOL_TOKEN@github.com/".insteadOf "https://github.com/"
          git ls-remote --heads https://github.com/MoTeam-cn/MoLaunch-Protocol | head -3

      # generate_context! 宏要求 frontendDist(../dist) 存在（tauri-build 校验）
      - name: Ensure frontend dist directory
        run: mkdir -p dist
      - run: cargo clippy --all-features -- -D warnings
        working-directory: src-tauri

      # cargo audit：已知且已评估的公告在此显式忽略，避免它们长期把 CI 顶红。
      # 忽略项必须写明原因；能升级就升级，不要靠 ignore 掩盖可修的问题。
      # - RUSTSEC-2024-0402（hashbrown 0.12/0.14）：仅影响 borsh 序列化路径，本项目不使用 borsh；
      #   受 indexmap 1.x / hashlink 版本约束，升级需连带重构依赖链。
      # - RUSTSEC-2023-0071（rsa 0.9 Marvin 计时侧信道）：上游无修复版本；本项目仅在离线解析
      #   旧版认证数据时使用，且不暴露远程计时面。
      # - RUSTSEC-2026-0367 / 0368 / 0369（zip 4 解压权限与符号链接）：Windows 无 SUID/SGID 语义；
      #   Linux 下启动器以普通用户身份运行，影响面限于用户自身目录；升级到 zip 9 需重写解压调用，
      #   列入后续依赖升级计划。
      - name: Security audit (cargo)
        uses: actions-rust-lang/audit@v1
        with:
          ignore: RUSTSEC-2024-0402,RUSTSEC-2023-0071,RUSTSEC-2026-0367,RUSTSEC-2026-0368,RUSTSEC-2026-0369
          file: src-tauri/Cargo.lock
          # 与原 rustsec-action 行为一致：仅 CI 报告，不自动创建 issue
          createIssues: false

      # 审计失败时打印具体条目，便于定位新增公告（默认只写 step summary，日志里看不到明细）
      - name: Security audit details
        if: failure()
        run: cargo audit -f src-tauri/Cargo.lock 2>&1 | tail -80 || true

  # Rust 测试
  rust-test:
    name: Rust Test
    permissions:
      contents: read
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      # 缓存 APT 包（.deb）：命中时跳过 apt-get update 与下载，直接安装缓存包，
      # 避免每次运行重复下载 libwebkit2gtk-4.1-dev 等大包（数百 MB）导致该步骤卡 10 分钟。
      - name: Install Linux dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libwebkit2gtk-4.1-dev build-essential clang curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
          version: 1.0
          execute_install_scripts: true

      # 私有协议库（molaunch-protocol）需要凭据：写 git 凭据文件并校验可访问
      - name: Authorize private protocol repo
        env:
          PROTOCOL_TOKEN: ${{ secrets.PROTOCOL_REPO_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$PROTOCOL_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git config --global url."https://x-access-token:$PROTOCOL_TOKEN@github.com/".insteadOf "https://github.com/"
          git ls-remote --heads https://github.com/MoTeam-cn/MoLaunch-Protocol | head -3

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context! 宏要求 frontendDist(../dist) 存在（tauri-build 校验）
      - name: Ensure frontend dist directory
        run: mkdir -p dist
      - run: cargo test --all-features
        working-directory: src-tauri
