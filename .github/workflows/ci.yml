name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src-tauri/tauri.conf.json'
      - 'Cargo.toml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src-tauri/tauri.conf.json'
      - 'Cargo.toml'
      - '.github/workflows/**'
  # 手动触发（Actions 页面 Run workflow 按钮）
  # ci.yml 本身不在 paths 过滤内，仅修改 workflow 文件不会自动触发 CI，需手动运行
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Node 22：@vitejs/plugin-vue@6 的 getHash 使用 crypto.hash（Node 21.7+ 才有），Node 18 下前端构建失败
  NODE_VERSION: '22'

jobs:
  # 检查是否跳过 CI
  check-skip:
    name: Check Skip
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        # 通过 env 传递 commit message，避免直接插值到 bash 表达式
        # 原写法 "${{ github.event.head_commit.message }}" 在 message 含双引号 / $ / 反引号时
        # 会被 shell 二次解析（如 cmd /c start "" "<path>" 中的 > 被当作重定向）
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$COMMIT_MSG" == *"!c"* ]]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  # 前端检查
  frontend-check:
    name: Frontend Check
    permissions:
      contents: read
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Frontend build
        run: npm run build

      - name: Lint
        run: npm run lint
      
      - name: Type check
        run: npm run typecheck

      - name: Security audit (npm)
        run: npm audit --audit-level=high

  # Rust 格式检查
  rust-fmt:
    name: Rust Format
    permissions:
      contents: read
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
        working-directory: src-tauri

  # Rust Clippy 检查
  rust-clippy:
    name: Rust Clippy
    permissions:
      contents: read
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential clang curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context! 宏要求 frontendDist(../dist) 存在（tauri-build 校验）
      - name: Ensure frontend dist directory
        run: mkdir -p dist
      - run: cargo clippy --all-features -- -D warnings
        working-directory: src-tauri

      - name: Security audit (cargo)
        uses: actions-rust-lang/audit@v1
        with:
          file: src-tauri/Cargo.lock
          # 与原 rustsec-action 行为一致：仅 CI 报告，不自动创建 issue
          createIssues: false

  # Rust 测试
  rust-test:
    name: Rust Test
    permissions:
      contents: read
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential clang curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # generate_context! 宏要求 frontendDist(../dist) 存在（tauri-build 校验）
      - name: Ensure frontend dist directory
        run: mkdir -p dist
      - run: cargo test --all-features
        working-directory: src-tauri
