<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoLaunch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100%;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(120% 160% at 8% 0%, rgba(22, 93, 255, 0.14), transparent 55%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.95) 0%, rgba(238, 244, 255, 0.93) 100%);
            overflow: hidden;
            user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .scene {
            position: relative;
            width: 640px;
            height: 180px;
        }

        /* ===== 图标 ===== */
        .icon {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 88px;
            height: 88px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: translate(-50%, -50%) scale(0.25);
            opacity: 0;
            transition: transform 1.1s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
        }
        .icon img {
            width: 80px;
            height: 80px;
            pointer-events: none;
        }
        .icon.show {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }
        .icon.move {
            transform: translate(-300px, -50%) scale(0.85) rotate(360deg);
            opacity: 1;
        }

        /* ===== 右侧内容 ===== */
        .content {
            position: absolute;
            left: 150px;
            top: 50%;
            width: 420px;
            transform: translateY(-50%) translateX(18px);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .content.show {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }

        .name {
            font-size: 38px;
            font-weight: 700;
            color: #1a1a1a;
            letter-spacing: 2px;
            min-height: 48px;
            display: flex;
            align-items: center;
        }
        .cursor {
            display: inline-block;
            width: 2px;
            height: 34px;
            background: #165dff;
            margin-left: 4px;
            animation: blink 0.8s step-end infinite;
        }
        .cursor.done {
            opacity: 0;
            animation: none;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        .bar {
            margin-top: 12px;
            width: 100%;
            height: 3px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 3px;
            overflow: hidden;
        }
        .bar .fill {
            height: 100%;
            width: 0%;
            background: #165dff;
            border-radius: 3px;
            transition: width 0.2s ease;
        }
        .info {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: rgba(17, 24, 39, 0.42);
            letter-spacing: 1px;
        }
        .info .status {
            color: rgba(0, 0, 0, 0.55);
        }
        .info .status.done {
            color: #165dff;
        }

        .sub {
            margin-top: 12px;
            font-size: 12px;
            color: rgba(17, 24, 39, 0.38);
            letter-spacing: 8px;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        .sub.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- 图标 -->
        <div class="icon" id="icon">
            <img src="logo.svg" alt="MoLaunch" draggable="false" />
        </div>

        <!-- 右侧 -->
        <div class="content" id="content">
            <div class="name"><span id="text"></span><span class="cursor" id="cursor"></span></div>
            <div class="bar"><div class="fill" id="fill"></div></div>
            <div class="info"><span>正在启动</span><span class="status" id="status">初始化...</span></div>
            <div class="sub" id="sub">— 匠心 · 启动 —</div>
        </div>
    </div>

    <script src="splash.js"></script>

</body>
</html>
