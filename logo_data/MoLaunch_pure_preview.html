<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoLaunch 纯净版 SVG</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 28px;
    background:
      linear-gradient(45deg,#d9e0e6 25%,transparent 25%) 0 0/32px 32px,
      linear-gradient(-45deg,#d9e0e6 25%,transparent 25%) 0 16px/32px 32px,
      linear-gradient(45deg,transparent 75%,#d9e0e6 75%) 16px -16px/32px 32px,
      linear-gradient(-45deg,transparent 75%,#d9e0e6 75%) -16px 0/32px 32px,
      #f5f7f9;
  }
  object {
    width: min(84vw, 760px);
    display: block;
  }
</style>
</head>
<body>
  <object type="image/svg+xml" data="MoLaunch_pure_animated.svg" aria-label="MoLaunch pure animated logo"></object>
</body>
</html>
